<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard — Shop Technology</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2070');
            --accent: #e22b2b;
            --card-bg: rgba(17, 18, 20, 0.8);
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: #000; color: #fff; display: flex; height: 100vh; overflow: hidden; }

        .bg-overlay { position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(226, 43, 43, 0.1) 0%, rgba(6, 6, 7, 1) 90%), var(--bg-image); background-size: cover; z-index: -1; }

        /* Sidebar Side */
        .sidebar { width: 260px; background: rgba(10, 10, 11, 0.95); border-right: 1px solid rgba(226, 43, 43, 0.2); display: flex; flex-direction: column; padding: 30px 15px; z-index: 10; }
        .brand-box { text-align: center; margin-bottom: 40px; }
        .brand-sub { color: var(--accent); font-family: Arial; font-weight: bold; }

        .nav-link { padding: 14px 18px; color: #888; text-decoration: none; border-radius: 12px; margin-bottom: 5px; display: block; transition: 0.3s; cursor: pointer; }
        .nav-link:hover, .nav-link.active { background: rgba(226, 43, 43, 0.1); color: #fff; }
        .nav-link.active { border-left: 3px solid var(--accent); }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; position: relative; }

        /* Hiệu ứng ẩn hiện các phần */
        .view-section { display: none; animation: fadeIn 0.4s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Style cho Dashboard (Trang chủ) */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; backdrop-filter: blur(10px); }
        .stat-card p { font-size: 28px; font-weight: 800; color: var(--accent); margin: 10px 0 0; }

        /* Style cho Quản lý sản phẩm */
        .glass-card { background: var(--card-bg); border-radius: 24px; padding: 30px; border: 1px solid rgba(226,43,43,0.2); backdrop-filter: blur(20px); }
        input, textarea { width: 100%; background: #000; border: 1px solid #333; padding: 12px; border-radius: 10px; color: #fff; margin-bottom: 15px; }
        .btn-submit { background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 800; cursor: pointer; }
        
        .product-item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #222; }

        .btn-logout { margin-top: auto; background: none; border: 1px solid #333; color: #888; padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>

    <aside class="sidebar">
        <div class="brand-box">
            <div style="font-size: 24px; font-weight: 800;">Shop</div>
            <div class="brand-sub">Technology</div>
        </div>
        <nav id="sidebarNav">
            <div class="nav-link active" data-target="viewHome">Trang chủ</div>
            <div class="nav-link">Đơn hàng của tôi</div>
            <div class="nav-link">Sản phẩm yêu thích</div>
            <div class="nav-link">Cài đặt tài khoản</div>
            <div class="nav-link" data-target="viewAddProduct">Thêm sản phẩm</div>
        </nav>
        <button class="btn-logout" id="btnLogout">Đăng xuất</button>
    </aside>

    <main class="main-content">
        <section id="viewHome" class="view-section active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
                <h1 id="welcomeText" style="font-size: 32px;">Xin chào!</h1>
                <a href="home.html" style="color: #888; text-decoration: none;">← Quay về Shop</a>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><h3>ĐƠN HÀNG</h3><p>05</p></div>
                <div class="stat-card"><h3>TÍCH LŨY</h3><p>1.200k</p></div>
                <div class="stat-card"><h3>HẠNG THẺ</h3><p>Gold</p></div>
            </div>
            <div class="glass-card">
                <h3>Hoạt động gần đây</h3>
                <div style="text-align: center; color: #555; padding: 50px;">Chưa có hoạt động nào để hiển thị.</div>
            </div>
        </section>

        <section id="viewAddProduct" class="view-section">
            <div id="listSection">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                    <h1>Sản phẩm trong kho</h1>
                    <button onclick="toggleProductMode('form')" style="background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:10px; cursor:pointer;">+ THÊM MỚI</button>
                </div>
                <div id="dashProductList" class="glass-card">
                    </div>
            </div>

            <div id="formSection" style="display:none;">
                <button onclick="toggleProductMode('list')" style="background:none; border:none; color:#888; cursor:pointer; margin-bottom:10px;">← Quay lại danh sách</button>
                <h2>Nhập thông tin sản phẩm mới</h2>
                <div class="glass-card" style="max-width: 500px;">
                    <form id="productForm">
                        <input type="text" id="pTitle" placeholder="Tên sản phẩm" required>
                        <input type="number" id="pPrice" placeholder="Giá tiền" required>
                        <input type="text" id="pImage" placeholder="Link ảnh">
                        <textarea id="pDesc" placeholder="Mô tả"></textarea>
                        <button type="submit" class="btn-submit">LƯU SẢN PHẨM</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>
        const PRODUCTS_KEY = 'webshop_products_v1';

        // 1. Xử lý chuyển đổi View chính (Trang chủ <-> Thêm sản phẩm)
        const navLinks = document.querySelectorAll('.nav-link');
        const sections = document.querySelectorAll('.view-section');

        navLinks.forEach(link => {
            link.onclick = () => {
                const target = link.getAttribute('data-target');
                if (!target) return;

                // Cập nhật Menu UI
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');

                // Ẩn hiện Section
                sections.forEach(s => s.classList.remove('active'));
                document.getElementById(target).classList.add('active');

                if (target === 'viewAddProduct') renderDashProducts();
            };
        });

        // 2. Xử lý trong phần Sản phẩm (List <-> Form)
        function toggleProductMode(mode) {
            document.getElementById('listSection').style.display = mode === 'list' ? 'block' : 'none';
            document.getElementById('formSection').style.display = mode === 'form' ? 'block' : 'none';
        }

        function renderDashProducts() {
            const data = JSON.parse(localStorage.getItem(PRODUCTS_KEY) || '[]');
            const list = document.getElementById('dashProductList');
            if (data.length === 0) {
                toggleProductMode('form');
            } else {
                toggleProductMode('list');
                list.innerHTML = data.map(p => `
                    <div class="product-item">
                        <span>${p.title}</span>
                        <span style="color:var(--accent)">${Number(p.price).toLocaleString()}đ</span>
                    </div>
                `).join('');
            }
        }

        // 3. User & Logout
        const user = JSON.parse(localStorage.getItem('wb_currentUser'));
        if (user) document.getElementById('welcomeText').textContent = `Xin chào, ${user.name}!`;

        document.getElementById('btnLogout').onclick = () => {
            localStorage.removeItem('wb_currentUser');
            window.location.href = 'login.html';
        };

        // Gửi form (Kết nối với script.js của bạn)
        document.getElementById('productForm').onsubmit = (e) => {
            // Lưu ý: Để đơn giản, bạn có thể copy logic lưu từ script.js vào đây 
            // hoặc phát sự kiện cho script.js xử lý.
            alert("Đã lưu! (Hãy kết nối logic lưu của bạn)");
            toggleProductMode('list');
        };
    </script>
</body>
</html>
